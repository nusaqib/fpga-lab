# meta-fpgalab - this repo's own Yocto layer, introduced in module 17.
# Holds everything we ADD on top of EDF: device-tree tweaks for UIO,
# app recipes, image definitions. Add it to the shared workspace once:
#
#   cd ~/yocto/edf && . ./edf-init-build-env build
#   bitbake-layers add-layer ~/gitsrc/embed/fpga-lab/linux/meta-fpgalab
#
# (bitbake-layers edits build/conf/bblayers.conf; the layer itself stays
# in the repo, versioned with the modules that use it.)
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fpgalab"
BBFILE_PATTERN_fpgalab = "^${LAYERDIR}/"
BBFILE_PRIORITY_fpgalab = "8"

LAYERDEPENDS_fpgalab = "core xilinx"
# Matches the poky release pinned by the rel-v2026.1 EDF manifest.
LAYERSERIES_COMPAT_fpgalab = "scarthgap"
